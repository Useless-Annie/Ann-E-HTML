<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>REEVA — Blog</title>
<meta name="description" content="REEVA connects people, local talent and sustainable fashion to give every garment a second life.">
<link rel="icon" href="../img/reeva-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css">

</head>

<body data-page="blog" data-root="../">

<!-- NAVBAR (component) -->
<div data-component="navbar"></div>

<main>

<section class="blog">
  <div class="container">
    <div class="reveal">
      <h2 class="title">Blog</h2>
      <p class="sub">Ideas, stories and guides for dressing with purpose.</p>
    </div>
    <div class="blogs">
      <!-- REPLACE: img/blog1.avif … blog3.avif -->
      <article class="post reveal"><figure class="ph" data-label="BLOG 1 · blog1.jpg"><img src="../img/blog1.avif" alt="Upcycling" onerror="this.remove()"></figure><div class="post-body"><h3>Upcycling</h3><p>How a forgotten garment becomes a brand-new piece.</p></div></article>
      <article class="post reveal d1"><figure class="ph" data-label="BLOG 2 · blog2.jpg"><img src="../img/blog2.avif" alt="Sustainable fashion" onerror="this.remove()"></figure><div class="post-body"><h3>Sustainable Fashion</h3><p>Small changes for a more conscious wardrobe.</p></div></article>
      <article class="post reveal d2"><figure class="ph" data-label="BLOG 3 · blog3.jpg"><img src="../img/blog3.avif" alt="Connecting talent" onerror="this.remove()"></figure><div class="post-body"><h3>Connecting Talent</h3><p>Stories from REEVA's emerging designers.</p></div></article>
    </div>
  </div>
</section>

<!-- CONTACT SECTION (component, shared by every page) -->
<div data-component="contact-section"></div>
</main>

<!-- FOOTER (component) -->
<div data-component="footer"></div>

<!-- CART DRAWER (component) -->
<div data-component="cart-drawer"></div>

<!-- TOAST (component) -->
<div data-component="toast"></div>

<script defer src="../js/components.js"></script>
<script defer src="../js/router.js"></script>

<script defer src="../js/contact.js"></script>
</body>
</html>
